[project]
name = "tatc-mcp"
version = "0.2.0rc1"
description = "MCP server for satellite ground track generation using TAT-C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy<2.2",
    "mcp==2.0.0a3",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "tatc>=3.4.10",
]

[project.scripts]
tatc-mcp = "tatc_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "pylint>=2.17.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tatc_mcp*"]
